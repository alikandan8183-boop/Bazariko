<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت آگهی | بازاریکو</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f3f5f8;
  color:#17243b;
}
header{
  background:#14243d;
  color:white;
  padding:22px 15px;
  text-align:center;
}
header h1{margin:0;color:#e6bd55}
header p{margin:8px 0 0;font-size:13px}
.container{
  max-width:600px;
  margin:22px auto;
  padding:0 14px;
}
.card{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 4px 18px #0000000c;
}
h2{margin-top:0;font-size:20px}
label{
  display:block;
  margin:17px 0 8px;
  font-weight:bold;
  font-size:14px;
}
input,select,textarea{
  width:100%;
  padding:14px;
  border:1px solid #dce1e8;
  border-radius:10px;
  font-family:inherit;
  font-size:15px;
  background:#fff;
}
textarea{min-height:110px;resize:vertical}
#priceWords{
  color:#16834a;
  font-weight:bold;
  margin-top:9px;
  min-height:22px;
  font-size:14px;
}
button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#d6aa38;
  color:#14243d;
  font-family:inherit;
  font-weight:bold;
  font-size:16px;
}
.note{
  margin-top:15px;
  color:#777;
  font-size:12px;
  line-height:2;
}
.back{
  display:block;
  text-align:center;
  margin:20px;
  color:#14243d;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <h1>بازاریکو</h1>
  <p>یک بازار، همه معاملات</p>
</header>

<div class="container">
<div class="card">

<h2>ثبت آگهی جدید</h2>

<form id="adForm">

<label>دسته‌بندی آگهی</label>
<select id="category" required>
  <option value="">انتخاب کنید</option>
  <option>طلا و فلزات گران‌بها</option>
  <option>خودرو</option>
  <option>ملک و زمین</option>
  <option>اجاره ویلا</option>
  <option>خرید و فروش کسب‌وکار</option>
  <option>کارخانه</option>
  <option>آهن و فلزات صنعتی</option>
</select>

<label>عنوان آگهی</label>
<input id="title" type="text"
placeholder="مثلاً فروش زمین ۱۰۰۰ متری"
required>

<label>قیمت (تومان)</label>
<input id="price" type="text"
inputmode="numeric"
placeholder="مثلاً ۲/۰۰۰/۰۰۰/۰۰۰"
required>

<div id="priceWords"></div>

<label>شهر</label>
<input id="city" type="text"
placeholder="نام شهر"
required>

<label>شماره تماس</label>
<input id="phone" type="tel"
inputmode="tel"
placeholder="شماره موبایل"
required>

<label>توضیحات آگهی</label>
<textarea id="description"
placeholder="مشخصات و توضیحات آگهی را بنویسید..."
required></textarea>

<button type="submit">ثبت آگهی</button>

</form>

<p class="note">
آگهی شما فعلاً به‌صورت پیش‌نویس در این دستگاه ذخیره می‌شود و هنوز عمومی منتشر نمی‌شود.
</p>

</div>
</div>

<a class="back" href="index.html">بازگشت به صفحه اصلی</a>

<script>
const priceInput = document.getElementById("price");
const priceWords = document.getElementById("priceWords");

const digits = "۰۱۲۳۴۵۶۷۸۹";

function toEnglishNumber(value){
  return value
    .replace(/[۰-۹]/g, d => digits.indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function threeDigits(value){
  return value.replace(/\B(?=(\d{3})+(?!\d))/g, "/");
}

const ones = [
"", "یک", "دو", "سه", "چهار", "پنج",
"شش", "هفت", "هشت", "نه"
];

const teens = [
"ده", "یازده", "دوازده", "سیزده", "چهارده",
"پانزده", "شانزده", "هفده", "هجده", "نوزده"
];

const tens = [
"", "", "بیست", "سی", "چهل", "پنجاه",
"شصت", "هفتاد", "هشتاد", "نود"
];

const hundreds = [
"", "صد", "دویست", "سیصد", "چهارصد",
"پانصد", "ششصد", "هفتصد", "هشتصد", "نهصد"
];

function threeToWords(n){
  if(n === 0) return "";

  let parts = [];
  let h = Math.floor(n / 100);
  let r = n % 100;

  if(h) parts.push(hundreds[h]);

  if(r >= 10 && r < 20){
    parts.push(teens[r - 10]);
  } else {
    let t = Math.floor(r / 10);
    let o = r % 10;
    if(t) parts.push(tens[t]);
    if(o) parts.push(ones[o]);
  }

  return parts.join(" و ");
}

function numberToWords(n){
  if(n === 0) return "صفر";

  const scales = [
    "",
    "هزار",
    "میلیون",
    "میلیارد",
    "تریلیون"
  ];

  let parts = [];
  let i = 0;

  while(n > 0){
    let chunk = n % 1000;

    if(chunk){
      let text = threeToWords(chunk);
      if(scales[i]) text += " " + scales[i];
      parts.unshift(text);
    }

    n = Math.floor(n / 1000);
    i++;
  }

  return parts.join(" و ");
}

priceInput.addEventListener("input", function(){
  let raw = toEnglishNumber(this.value);
  raw = raw.replace(/\D/g, "");

  if(!raw){
    this.value = "";
    priceWords.innerText = "";
    return;
  }

  this.value = threeDigits(raw);

  let number = Number(raw);

  if(Number.isSafeInteger(number)){
    priceWords.innerText =
      numberToWords(number) + " تومان";
  } else {
    priceWords.innerText = "مبلغ واردشده بسیار بزرگ است";
  }
});

document.getElementById("adForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  const rawPrice = toEnglishNumber(priceInput.value)
    .replace(/\D/g, "");

  const ad = {
    category: document.getElementById("category").value,
    title: document.getElementById("title").value,
    price: rawPrice,
    city: document.getElementById("city").value,
    phone: document.getElementById("phone").value,
    description: document.getElementById("description").value,
    date: new Date().toISOString()
  };

  let ads = JSON.parse(
    localStorage.getItem("bazariko_ads") || "[]"
  );

  ads.push(ad);

  localStorage.setItem("bazariko_ads", JSON.stringify(ads));

  alert("آگهی شما به‌صورت پیش‌نویس ذخیره شد.");

  this.reset();
  priceWords.innerText = "";
});
</script>

</body>
</html>
